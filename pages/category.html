<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Category — MODE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>✦</text></svg>">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="../index.html" class="header-logo">M<span>ODE</span></a>
      <nav class="header-nav">
        <a href="category.html?cat=new-arrivals">New Arrivals</a>
        <a href="category.html?cat=trending">Trending</a>
        <a href="category.html?cat=sale">Sale</a>
      </nav>
      <div class="header-actions">
        <button class="btn-icon" data-search aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <a href="wishlist.html" class="btn-icon" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </a>
        <button class="btn-icon" data-cart-toggle aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
        <a href="profile.html" class="btn-icon" aria-label="Profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="page-wrapper">
    <div class="container">
      <div class="category-header">
        <h1 class="category-title" id="category-title">Category</h1>
        <p class="category-count" id="category-count">0 products</p>
      </div>

      <div class="category-controls">
        <button class="filter-btn" id="filter-toggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>
          Filters
        </button>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="text-small" style="display:none;" id="active-filters"></span>
          <select class="sort-select" id="sort-select">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>
      </div>

      <div class="grid-4" id="product-grid"></div>

      <div class="section" style="text-align:center;display:none;" id="load-more-wrap">
        <button class="btn btn-outline" id="load-more">Load More</button>
      </div>
    </div>
  </main>

  <!-- Filter Sidebar -->
  <div class="cart-overlay" id="filter-overlay"></div>
  <div class="filter-sidebar" id="filter-sidebar">
    <div class="filter-sidebar-header">
      <h3 style="font-size:1.125rem;font-weight:600;">Filters</h3>
      <button class="btn-icon" id="filter-close" aria-label="Close filters">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="filter-sidebar-body">
      <div class="filter-group">
        <p class="filter-group-title">Brand</p>
        <div class="filter-options" id="filter-brand"></div>
      </div>
      <div class="filter-group">
        <p class="filter-group-title">Price</p>
        <div class="filter-options" id="filter-price">
          <button class="filter-option" data-price="0-100">Under $100</button>
          <button class="filter-option" data-price="100-200">$100 - $200</button>
          <button class="filter-option" data-price="200-500">$200 - $500</button>
          <button class="filter-option" data-price="500-9999">$500+</button>
        </div>
      </div>
      <div class="filter-group">
        <p class="filter-group-title">Size</p>
        <div class="filter-options" id="filter-size">
          <button class="filter-option" data-size="XS">XS</button>
          <button class="filter-option" data-size="S">S</button>
          <button class="filter-option" data-size="M">M</button>
          <button class="filter-option" data-size="L">L</button>
          <button class="filter-option" data-size="XL">XL</button>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:16px;" id="clear-filters">Clear All</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Home</span>
    </a>
    <a href="category.html?cat=new-arrivals" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Shop</span>
    </a>
    <a href="wishlist.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Wishlist</span>
    </a>
    <a href="#" data-cart-toggle>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Cart</span>
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3 class="cart-title">Cart</h3>
      <button class="btn-icon" onclick="cart.close()" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cart-items"></div>
    <div class="cart-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <p>Your cart is empty</p>
    </div>
    <div class="cart-footer">
      <div class="cart-subtotal">
        <span class="cart-subtotal-label">Subtotal</span>
        <span class="cart-subtotal-value">$0</span>
      </div>
      <a href="checkout.html" class="btn btn-primary" style="width:100%;text-align:center;">Checkout</a>
    </div>
  </div>

  <div class="search-overlay" id="search-overlay">
    <button class="btn-icon search-close" onclick="search.close()" aria-label="Close search">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="search-container">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search-input" type="text" placeholder="Search..." autocomplete="off">
      </div>
      <div id="search-suggestions">
        <div class="search-suggestions">
          <p class="search-suggestions-title">Trending</p>
          <div class="search-trending" id="search-trending"></div>
        </div>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cat = getUrlParam('cat') || 'new-arrivals';
      const catNames = { 'new-arrivals': 'New Arrivals', 'trending': 'Trending', 'sale': 'Sale' };
      document.getElementById('category-title').textContent = catNames[cat] || 'Products';

      let filteredProducts = getProductsByCategory(cat);
      let displayedCount = 8;
      let activeFilters = { brand: null, price: null, size: null };

      const brandNames = [...new Set(filteredProducts.map(p => p.brand))];
      const brandFilterEl = document.getElementById('filter-brand');
      brandFilterEl.innerHTML = brandNames.map(b =>
        `<button class="filter-option" data-brand="${b}">${b}</button>`
      ).join('');

      function applyFilters() {
        let result = getProductsByCategory(cat);
        if (activeFilters.brand) {
          result = result.filter(p => p.brand === activeFilters.brand);
        }
        if (activeFilters.price) {
          const [min, max] = activeFilters.price.split('-').map(Number);
          result = result.filter(p => p.price >= min && p.price <= max);
        }
        if (activeFilters.size) {
          result = result.filter(p => p.sizes.includes(activeFilters.size));
        }
        filteredProducts = result;
        document.getElementById('category-count').textContent = `${result.length} products`;
        return result;
      }

      function renderProducts(products, append = false) {
        const grid = document.getElementById('product-grid');
        const toShow = products.slice(0, displayedCount);
        const html = toShow.map(p => renderProductCard(p)).join('');
        if (append) {
          grid.insertAdjacentHTML('beforeend', html);
        } else {
          grid.innerHTML = html;
        }
        const loadMore = document.getElementById('load-more-wrap');
        if (products.length > displayedCount) {
          loadMore.style.display = 'block';
        } else {
          loadMore.style.display = 'none';
        }
      }

      function updateAndRender() {
        const result = applyFilters();
        displayedCount = 8;
        renderProducts(result);
      }

      document.querySelectorAll('.filter-option').forEach(btn => {
        btn.addEventListener('click', function() {
          const group = this.parentElement;
          group.querySelectorAll('.filter-option').forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          if (this.dataset.brand) activeFilters.brand = this.dataset.brand;
          else if (this.dataset.price) activeFilters.price = this.dataset.price;
          else if (this.dataset.size) activeFilters.size = this.dataset.size;

          updateAndRender();
        });
      });

      document.getElementById('clear-filters').addEventListener('click', () => {
        activeFilters = { brand: null, price: null, size: null };
        document.querySelectorAll('.filter-option').forEach(b => b.classList.remove('active'));
        updateAndRender();
      });

      document.getElementById('sort-select').addEventListener('change', function() {
        const val = this.value;
        let sorted = [...filteredProducts];
        if (val === 'price-low') sorted.sort((a, b) => a.price - b.price);
        else if (val === 'price-high') sorted.sort((a, b) => b.price - a.price);
        filteredProducts = sorted;
        displayedCount = 8;
        renderProducts(filteredProducts);
      });

      renderProducts(filteredProducts);
      document.getElementById('category-count').textContent = `${filteredProducts.length} products`;

      document.getElementById('load-more').addEventListener('click', () => {
        displayedCount += 8;
        renderProducts(filteredProducts);
      });

      document.getElementById('filter-toggle').addEventListener('click', () => {
        document.getElementById('filter-sidebar').classList.add('active');
        document.getElementById('filter-overlay').classList.add('active');
        document.body.classList.add('no-scroll');
      });

      function closeFilters() {
        document.getElementById('filter-sidebar').classList.remove('active');
        document.getElementById('filter-overlay').classList.remove('active');
        document.body.classList.remove('no-scroll');
      }

      document.getElementById('filter-close').addEventListener('click', closeFilters);
      document.getElementById('filter-overlay').addEventListener('click', closeFilters);
    });
  </script>
</body>
</html>
